{% macro country_field(id, value='', required=false) %}
  <label for="{{ id }}">{{ tr("Pays de résidence") }}{% if not required %} {{ tr("(facultatif)") }}{% endif %}</label>
  <select id="{{ id }}" name="country" autocomplete="country" {% if required %}required{% endif %}>
    <option value="">{{ tr("Choisir un pays") }}</option>
    {% for code, label in localized_country_options() %}<option value="{{ code }}" {% if value == code %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
{% endmacro %}
