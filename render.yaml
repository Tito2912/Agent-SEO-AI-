databases:
  - name: seo-agent-db
    ipAllowList: []

services:
  - type: web
    name: seo-agent-web
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seo-agent-db
          property: connectionString
      - key: SEO_AGENT_DATA_DIR
        value: /var/data/data
      - key: SEO_AGENT_RUNS_DIR
        value: /var/data/seo-runs
      - key: SEO_AGENT_CONFIG_PATH
        value: /app/seo-autopilot.yml
      - key: SEO_AGENT_SECRET_KEY
        generateValue: true
      - key: SEO_AGENT_STRICT_CONFIG
        value: "true"
      - key: SEO_AGENT_TRUST_PROXY_HEADERS
        value: "true"
      - key: SEO_AGENT_CSP_ENABLED
        value: "true"
      - key: SEO_AGENT_CSP_REPORT_ONLY
        value: "false"
      - key: SEO_AGENT_FILE_VIEW_MAX_BYTES
        value: "2097152"
      - key: SEO_AGENT_CSRF_BODY_MAX_BYTES
        value: "12582912"
      - key: SEO_AGENT_ENCRYPTION_KEY
        sync: false
      - key: SEO_AGENT_ENCRYPTION_KEYS
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_PREFIX
        value: seo-runs
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: SIGNUP_INVITE_CODE
        sync: false
      - key: SIGNUP_ALLOWLIST_EMAILS
        sync: false
      - key: SIGNUP_ALLOWLIST_DOMAINS
        sync: false
      - key: SIGNUP_DISABLED
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_REDIRECT_URI
        sync: false
      - key: NETLIFY_OAUTH_CLIENT_ID
        sync: false
      - key: NETLIFY_OAUTH_REDIRECT_URI
        sync: false
      - key: BING_OAUTH_CLIENT_ID
        sync: false
      - key: BING_OAUTH_CLIENT_SECRET
        sync: false
      - key: BING_OAUTH_REDIRECT_URI
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: APP_NAME
        sync: false
      - key: PAGESPEED_API_KEY
        sync: false
      - key: BING_WEBMASTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: BETA_BASIC_AUTH_USER
        sync: false
      - key: BETA_BASIC_AUTH_PASS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_SOLO
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: STRIPE_PRICE_ID_BUSINESS
        sync: false
      - key: SEO_AGENT_DISABLE_WORKER
        value: "true"
      # Inert here: this service runs with SEO_AGENT_DISABLE_WORKER=true. Kept only so the
      # value is visible next to the flag that disables it; the real setting is on the worker.
      - key: SEO_AGENT_WORKER_CONCURRENCY
        value: "1"
      - key: SEO_AGENT_CRAWL_JOB_TIMEOUT_SECONDS
        value: "21600"
      - key: SEO_AGENT_AUTOPILOT_JOB_TIMEOUT_SECONDS
        value: "10800"
      - key: SEO_AGENT_JOBS_RETENTION_DAYS
        sync: false
      - key: SEO_AGENT_RUNS_RETENTION_DAYS
        sync: false
      - key: SEO_AGENT_RETENTION_EVERY_SECONDS
        value: "21600"
      # Mail transport. MAIL_API_PROVIDER + MAIL_API_KEY drive a provider over its HTTP API
      # and take precedence over the SMTP block below; SMTP_FROM/SMTP_FROM_NAME still supply
      # the sender. Declared here because an undeclared variable is one a blueprint re-sync
      # can drop — and losing these does not break loudly, it turns email verification off.
      - key: MAIL_API_PROVIDER
        sync: false
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_STARTTLS
        sync: false
      - key: SMTP_SSL
        sync: false
      - key: SMTP_TIMEOUT_SECONDS
        sync: false
      - key: EMAIL_VERIFICATION_DISABLED
        sync: false
      - key: EMAIL_VERIFY_TTL_SECONDS
        sync: false
      - key: EMAIL_VERIFY_EMAIL_SUBJECT
        sync: false
      - key: PASSWORD_RESET_TTL_SECONDS
        sync: false
      - key: PASSWORD_RESET_EMAIL_SUBJECT
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: SENTRY_ENVIRONMENT
        value: "prod"

  - type: worker
    name: seo-agent-worker
    runtime: docker
    # MUST stay standard (1 CPU / 2 GB): a headless Chromium alone costs 250-400 MB, so the
    # starter tier's 512 MB cannot crawl at all. The file said `starter` while the live service
    # ran on standard — a blueprint re-sync would have silently downgraded the worker into OOM.
    plan: standard
    # DELIBERATELY NO DISK. Render refuses to scale a service to several instances while a
    # disk is attached, and the worker is the CPU-bound half of the platform — crawling is
    # where throughput dies, so it is the half that must scale horizontally.
    # Nothing here needed persistence: /var/data/seo-runs is a CACHE (S3 is the source of
    # truth, `_ensure_runs_artifact_local` re-downloads on read), jobs live in Postgres, and
    # GSC refresh tokens live encrypted in the DB. The 3044 files found on the old disk were
    # verified present in S3 before it was removed.
    # Re-adding a disk here silently caps the platform at one worker again.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seo-agent-db
          property: connectionString
      - key: SEO_AGENT_SERVICE_MODE
        value: worker
      # Two jobs in parallel so one large crawl can no longer freeze every other customer:
      # the queue is FIFO and served by a single claimer, so a 6-hour crawl used to block the
      # whole platform. This buys FAIRNESS, not throughput — the box is CPU-bound, so the same
      # total pages/hour is simply shared instead of monopolised.
      - key: SEO_AGENT_WORKER_CONCURRENCY
        value: "2"
      # …and each job now drives ONE headless Chromium instead of three. A browser costs
      # 250-400 MB on a 2 GB instance, so 2 jobs x 3 browsers would be ~2.1 GB and OOM.
      # 2 x 1 = 2 browsers is BELOW today's 1 x 3, so the memory profile improves while two
      # crawls progress at once. Raise this once the instance has more RAM.
      - key: SEO_AGENT_BROWSER_WORKERS
        value: "1"
      - key: SEO_AGENT_DATA_DIR
        value: /var/data/data
      - key: SEO_AGENT_RUNS_DIR
        value: /var/data/seo-runs
      - key: SEO_AGENT_CONFIG_PATH
        value: /app/seo-autopilot.yml
      # Required to decrypt/encrypt secrets stored in DB (must match the web service).
      - key: SEO_AGENT_ENCRYPTION_KEY
        sync: false
      - key: SEO_AGENT_ENCRYPTION_KEYS
        sync: false
      # Runs artefacts storage (recommended when separating web/worker).
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_PREFIX
        value: seo-runs
      # Integrations / AI keys used during jobs
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: PAGESPEED_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: BING_OAUTH_CLIENT_ID
        sync: false
      - key: BING_OAUTH_CLIENT_SECRET
        sync: false
      - key: NETLIFY_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      # Retention
      - key: SEO_AGENT_JOBS_RETENTION_DAYS
        sync: false
      - key: SEO_AGENT_RUNS_RETENTION_DAYS
        sync: false
      - key: SEO_AGENT_RETENTION_EVERY_SECONDS
        value: "21600"
      # Monitoring / alerting
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: SENTRY_ENVIRONMENT
        value: "prod"

  - type: cron
    name: noyaru-db-backup
    runtime: docker
    plan: starter
    region: oregon
    schedule: "0 2 * * *"
    dockerCommand: python -m backend.backup
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seo-agent-db
          property: connectionString
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: BACKUP_SKIP_DATA_DIR
        value: "true"
      - key: BACKUP_ENV
        value: noyaru-prod
      - key: BACKUP_S3_PREFIX
        value: backups
      - key: BACKUP_RETENTION_DAYS
        value: "30"
