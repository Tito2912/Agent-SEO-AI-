# Sort du brouillon les pull requests de correction dont le depot du client a valide le build.
#
# POURQUOI ICI ET PAS DANS `render.yaml` : un cron Render demarre un conteneur a chaque passage,
# ce qui est cher pour un appel HTTP de trois secondes. Et surtout, une entree creee a la main
# dans le tableau de bord se perd le jour d'une resynchronisation de blueprint — or son absence
# ne casse rien de visible : les corrections restent simplement en brouillon. Un fichier dans le
# depot se relit, se versionne et part avec le reste.
#
# CADENCE : cinq minutes est le minimum de GitHub, et c'est suffisant. La fenetre d'attente cote
# application est de trente minutes, et une CI rend son verdict en une a cinq minutes. Un
# passage plus frequent n'avancerait rien.
#
# SI CE WORKFLOW DISPARAIT, le produit ne s'arrete pas : le balayage tourne aussi depuis
# `/cron/autopilot`. Il ralentit, il ne bloque pas. C'est voulu.

name: Sortir du brouillon les corrections validees

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:        # pour declencher a la main pendant une verification

concurrency:
  # Deux balayages en parallele reprendraient les memes pull requests. Le second est annule.
  group: verify-pull-requests
  cancel-in-progress: false

jobs:
  balayer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appeler le balayage
        env:
          BASE_URL: ${{ vars.NOYARU_BASE_URL || 'https://noyaru.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET absent des secrets du depot — le balayage ne peut pas s'authentifier."
            exit 1
          fi
          # --fail-with-body : un 401 ou un 500 doit FAIRE ECHOUER le workflow. Sans ca,
          # l'appel echouerait en silence et les corrections resteraient en brouillon sans
          # que personne ne recoive rien.
          curl --fail-with-body --silent --show-error --location \
               --max-time 120 \
               -X POST \
               -H "Authorization: Bearer $CRON_SECRET" \
               "$BASE_URL/cron/verify-pull-requests"
          echo
