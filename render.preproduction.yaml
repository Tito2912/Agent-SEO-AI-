# Create as a NEW Blueprint, never sync this over the production Blueprint.
# Disable Blueprint Auto Sync in the dashboard too; service auto-deploy is separate.
previews:
  generation: "off"

databases:
  - name: noyaru-preproduction-db
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "16"
    diskSizeGB: 5
    ipAllowList: []
    connectionPool: none

envVarGroups:
  - name: noyaru-preproduction-shared
    envVars:
      - key: SEO_AGENT_ENCRYPTION_KEY
        generateValue: true
      - key: SEO_AGENT_ENCRYPTION_KEYS
        value: ""
      - key: PLAN_CONFIG_JSON
        value: "{}"
      - key: SEO_AGENT_STRICT_CONFIG
        value: "true"
      - key: SEO_AGENT_DISABLE_SCHEDULERS
        value: "true"
      - key: SEO_AGENT_NOINDEX
        value: "true"
      - key: SEO_AGENT_DATA_DIR
        value: /var/data/data
      - key: SEO_AGENT_RUNS_DIR
        value: /var/data/seo-runs
      - key: SEO_AGENT_CONFIG_PATH
        value: /app/seo-autopilot.yml
      - key: SEO_AGENT_JOBS_RETENTION_DAYS
        value: "0"
      - key: SEO_AGENT_RUNS_RETENTION_DAYS
        value: "0"
      - key: SEO_CORRECTION_AI_PROVIDER
        value: none
      - key: SEO_AUDIT_ASSISTANT_PROVIDER
        value: none
      - key: ANTHROPIC_API_KEY
        value: ""
      - key: OPENAI_API_KEY
        value: ""
      - key: GOOGLE_GEMINI_API_KEY
        value: ""
      - key: PAGESPEED_API_KEY
        value: ""
      - key: GITHUB_TOKEN
        value: ""
      - key: GITHUB_OAUTH_CLIENT_ID
        value: ""
      - key: GITHUB_OAUTH_CLIENT_SECRET
        value: ""
      - key: GOOGLE_OAUTH_CLIENT_ID
        value: ""
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        value: ""
      - key: NETLIFY_OAUTH_CLIENT_ID
        value: ""
      - key: BING_OAUTH_CLIENT_ID
        value: ""
      - key: BING_OAUTH_CLIENT_SECRET
        value: ""
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: STRIPE_WEBHOOK_SECRET
        value: ""
      - key: AWS_ACCESS_KEY_ID
        value: ""
      - key: AWS_SECRET_ACCESS_KEY
        value: ""
      - key: AWS_REGION
        value: us-west-2
      - key: AWS_S3_ENDPOINT_URL
        value: ""
      - key: S3_BUCKET_NAME
        value: ""
      - key: S3_PREFIX
        value: noyaru-preproduction/seo-runs
      - key: AWS_EC2_METADATA_DISABLED
        value: "true"
      - key: SMTP_HOST
        value: ""
      - key: SMTP_USERNAME
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: SENDGRID_API_KEY
        value: ""
      - key: SENTRY_DSN
        value: ""
      - key: SENTRY_ENVIRONMENT
        value: preproduction

services:
  - type: web
    name: noyaru-preproduction-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: codex/corrector-recovery-20261003
    autoDeployTrigger: "off"
    plan: 0.5c-512mb
    region: oregon
    numInstances: 1
    healthCheckPath: /healthz
    disk:
      name: noyaru-preproduction-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - fromGroup: noyaru-preproduction-shared
      - key: DATABASE_URL
        fromDatabase:
          name: noyaru-preproduction-db
          property: connectionString
      - key: SEO_AGENT_SERVICE_MODE
        value: web
      - key: SEO_AGENT_DISABLE_WORKER
        value: "true"
      - key: SEO_AGENT_SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: noyaru-preproduction-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SEO_AGENT_TRUST_PROXY_HEADERS
        value: "true"
      - key: SIGNUP_DISABLED
        value: "true"
      - key: SIGNUP_INVITE_CODE
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BETA_BASIC_AUTH_USER
        value: preproduction
      - key: BETA_BASIC_AUTH_PASS
        generateValue: true

  - type: worker
    name: noyaru-preproduction-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: codex/corrector-recovery-20261003
    autoDeployTrigger: "off"
    plan: 1c-2g
    region: oregon
    numInstances: 1
    envVars:
      - fromGroup: noyaru-preproduction-shared
      - key: DATABASE_URL
        fromDatabase:
          name: noyaru-preproduction-db
          property: connectionString
      - key: SEO_AGENT_SERVICE_MODE
        value: worker
      - key: SEO_AGENT_WORKER_CONCURRENCY
        value: "2"
      - key: SEO_AGENT_BROWSER_WORKERS
        value: "1"
